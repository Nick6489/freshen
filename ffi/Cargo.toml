[package]
name = "freshen-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "C ABI for the freshen authenticated desktop updater"
license = "MIT"
repository = "https://github.com/Nick6489/freshen"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
freshen = { path = ".." }
semver = "1"
url = "2"

[dev-dependencies]
base64 = "0.22"
cbindgen = { version = "0.29", default-features = false }
ed25519-dalek = "2.2"
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
