language = "C"
include_guard = "FRESHEN_FFI_H"
cpp_compat = true
usize_is_size_t = true
sys_includes = ["stddef.h", "stdint.h", "stdbool.h"]
no_includes = true
documentation = true
documentation_style = "c99"
header = """
/*
 * freshen C ABI. GENERATED by cbindgen from ffi/src; do not edit by hand.
 * Regenerate with: FRESHEN_UPDATE_HEADER=1 cargo test -p freshen-ffi --test header
 */"""

[parse]
parse_deps = false

[export]
include = []
