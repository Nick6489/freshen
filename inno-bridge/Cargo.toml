[package]
name = "freshen-inno-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Optional Inno Setup telemetry bridge for Freshen"
publish = false

[lib]
name = "FreshenInno"
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory"] }
