name: Rust
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Lint
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit, process and C ABI integration tests
        run: cargo +stable test --workspace --all-targets --locked
      - name: Documentation tests
        run: cargo +stable test --workspace --doc --locked
      - name: Check distributable crate
        run: cargo +stable package --locked -p freshen

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Restore
        run: dotnet restore bindings/dotnet/Freshen.sln
      - name: Format
        run: dotnet format bindings/dotnet/Freshen.sln --verify-no-changes --no-restore
      - name: Build and test the .NET binding
        run: dotnet test bindings/dotnet/Freshen.sln --no-restore
      - name: Pack and verify the NuGet package (Linux natives only)
        run: |
          sh bindings/dotnet/Tools/pack.sh
          sh bindings/dotnet/Tools/verify-package.sh bindings/dotnet/artifacts/Freshen.*.nupkg

  objc-syntax:
    # Language-level check only (ARC, blocks, nullability) against a stub Foundation;
    # it needs no Apple SDK. The real build and tests are the `objc` job below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check the Objective-C binding
        run: sh bindings/objc/Tools/check-syntax.sh

  objc:
    # Builds and runs the Objective-C binding for real. It has never been run on a
    # Mac yet, so a failure here is informative rather than blocking; remove
    # continue-on-error once it has passed.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build and test the Objective-C binding
        run: sh bindings/objc/Tools/run-tests.sh
