[package]
name = "freshen"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "GUI-independent authenticated desktop application updates"
license = "MIT"
repository = "https://github.com/Nick6489/freshen"
readme = "README.md"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
fs2 = "0.4"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
url = { version = "2", features = ["serde"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tiny_http = "0.12"

[[bin]]
name = "freshen-helper"
path = "src/bin/helper.rs"

[[bin]]
name = "freshen-release"
path = "src/bin/release.rs"

