[package]
name = "freshen-native-test-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Native Windows dialog application for exercising Freshen Inno servicing"

[[bin]]
name = "freshen-native-test"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
freshen = { path = ".." }
base64 = "0.22"
serde_json = "1"
url = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3"
